name: memora

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-memora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memora_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-memora}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes']
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    profiles: [app]
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-http://deb.debian.org}
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-memora}:${POSTGRES_PASSWORD:-memora_local_only}@postgres:5432/${POSTGRES_DB:-memora}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}
      DEPENDENCY_TIMEOUT_SECONDS: ${DEPENDENCY_TIMEOUT_SECONDS:-3}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_TOKEN_PARAMETER: ${LLM_TOKEN_PARAMETER:-max_completion_tokens}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1024}
      LLM_CONTEXT_TOKEN_BUDGET: ${LLM_CONTEXT_TOKEN_BUDGET:-12000}
      LLM_CONNECT_TIMEOUT_SECONDS: ${LLM_CONNECT_TIMEOUT_SECONDS:-5}
      LLM_READ_TIMEOUT_SECONDS: ${LLM_READ_TIMEOUT_SECONDS:-30}
      LLM_TOTAL_TIMEOUT_SECONDS: ${LLM_TOTAL_TIMEOUT_SECONDS:-120}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-1}
      LLM_MAX_CONCURRENT_REQUESTS: ${LLM_MAX_CONCURRENT_REQUESTS:-2}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai_compatible}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-0}
      EMBEDDING_SEND_DIMENSIONS: ${EMBEDDING_SEND_DIMENSIONS:-true}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
      EMBEDDING_MAX_RETRIES: ${EMBEDDING_MAX_RETRIES:-1}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      PROVIDER_RETRY_MAX_WAIT_SECONDS: ${PROVIDER_RETRY_MAX_WAIT_SECONDS:-15}
      EMBEDDING_NORMALIZE: ${EMBEDDING_NORMALIZE:-false}
      EMBEDDING_MAX_INPUT_BYTES: ${EMBEDDING_MAX_INPUT_BYTES:-0}
      EMBEDDING_MAX_CONCURRENT_REQUESTS: ${EMBEDDING_MAX_CONCURRENT_REQUESTS:-1}
      EMBEDDING_MIN_INTERVAL_SECONDS: ${EMBEDDING_MIN_INTERVAL_SECONDS:-4}
      EMBEDDING_CACHE_TTL_SECONDS: ${EMBEDDING_CACHE_TTL_SECONDS:-86400}
      MEETING_MAX_UPLOAD_BYTES: ${MEETING_MAX_UPLOAD_BYTES:-65536}
      MEETING_MAX_INPUT_BYTES: ${MEETING_MAX_INPUT_BYTES:-8000}
      MEETING_MAX_OUTPUT_TOKENS: ${MEETING_MAX_OUTPUT_TOKENS:-3000}
      MEETING_REPAIR_ATTEMPTS: ${MEETING_REPAIR_ATTEMPTS:-1}
      SMTP_MODE: ${SMTP_MODE:-disabled}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-memora@example.test}
      SMTP_SECURITY: ${SMTP_SECURITY:-none}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
      SMTP_EXTERNAL_SEND_ENABLED: ${SMTP_EXTERNAL_SEND_ENABLED:-false}
      DEMO_ALLOWED_RECIPIENTS: ${DEMO_ALLOWED_RECIPIENTS:-}
      SMTP_HOST: ${SMTP_DOCKER_HOST:-mailpit}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      SEARCH_BASE_URL: ${SEARCH_BASE_URL:-https://api.tavily.com}
      SEARCH_MAX_RESULTS: ${SEARCH_MAX_RESULTS:-5}
      SEARCH_TIMEOUT_SECONDS: ${SEARCH_TIMEOUT_SECONDS:-15}
      SEARCH_CACHE_TTL_SECONDS: ${SEARCH_CACHE_TTL_SECONDS:-300}
      PRESENTATION_MAX_OUTPUT_TOKENS: ${PRESENTATION_MAX_OUTPUT_TOKENS:-6000}
      PRESENTATION_JOB_TIMEOUT_SECONDS: ${PRESENTATION_JOB_TIMEOUT_SECONDS:-240}
      PRESENTATION_CONVERSION_TIMEOUT_SECONDS: ${PRESENTATION_CONVERSION_TIMEOUT_SECONDS:-90}
      PRESENTATION_NODE: ${PRESENTATION_NODE:-node}
      PRESENTATION_LIBREOFFICE: ${PRESENTATION_LIBREOFFICE:-libreoffice}
      STORAGE_ROOT: /data/private
      PDF_MAX_UPLOAD_BYTES: ${PDF_MAX_UPLOAD_BYTES:-20971520}
      PDF_MAX_PAGES: ${PDF_MAX_PAGES:-100}
      PDF_MAX_TEXT_CHARS: ${PDF_MAX_TEXT_CHARS:-1000000}
      PDF_PARSE_TIMEOUT_SECONDS: ${PDF_PARSE_TIMEOUT_SECONDS:-30}
      PDF_CHUNK_TOKENS: ${PDF_CHUNK_TOKENS:-600}
      PDF_CHUNK_OVERLAP: ${PDF_CHUNK_OVERLAP:-100}
      PDF_MAX_CHUNKS: ${PDF_MAX_CHUNKS:-2000}
      INGEST_JOB_TIMEOUT_SECONDS: ${INGEST_JOB_TIMEOUT_SECONDS:-300}
      INGEST_MAX_ACTIVE_JOBS: ${INGEST_MAX_ACTIVE_JOBS:-3}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RAG_MIN_SIMILARITY: ${RAG_MIN_SIMILARITY:-0.35}
    command: [alembic, upgrade, head]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-http://deb.debian.org}
    environment: *backend-env
    volumes:
      - private_files:/data/private
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 12
    restart: unless-stopped

  worker:
    profiles: [app]
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-http://deb.debian.org}
    environment: *backend-env
    volumes:
      - private_files:/data/private
    command: [python, -m, app.workers.run]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -m, app.workers.health]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 1g
    restart: unless-stopped

  frontend:
    profiles: [app]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  mailpit:
    profiles: [mail]
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  private_files:
