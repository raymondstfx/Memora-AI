server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    client_max_body_size 21m;
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 330s;
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
    }
    # PDF.js uses an ES module worker; browsers require a JavaScript MIME type.
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }
    location = /docs {
        proxy_pass http://api:8000;
    }
    location = /openapi.json {
        proxy_pass http://api:8000;
    }
}
